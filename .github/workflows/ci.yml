name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
      - 'plugins/*/v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale PR validation; isolate other runs so publication can finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        run: uv run python -m pytest -v --cov=plugins --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  validate-lint:
    name: Validate Plugins and Lint
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        id: dependencies
        run: uv sync --locked --extra dev

      - name: Validate plugin manifests
        id: manifests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python scripts/validate_plugins.py

      - name: Validate marketplace wrapper
        id: marketplace
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python marketplace/validator/validate.py

      - name: Score review canary
        id: canary
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python scripts/review_canary.py tests/fixtures/review_canaries/worker_model_cache_scheduling/sample_review.md

      - name: Run ruff check
        id: ruff_check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python -m ruff check .

      - name: Run ruff format check
        id: ruff_format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python -m ruff format --check .

      - name: Require all validation and lint outcomes
        if: ${{ !cancelled() }}
        env:
          MANIFEST_OUTCOME: ${{ steps.manifests.outcome }}
          MARKETPLACE_OUTCOME: ${{ steps.marketplace.outcome }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          RUFF_CHECK_OUTCOME: ${{ steps.ruff_check.outcome }}
          RUFF_FORMAT_OUTCOME: ${{ steps.ruff_format.outcome }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import sys

          required = (
              "MANIFEST_OUTCOME",
              "MARKETPLACE_OUTCOME",
              "CANARY_OUTCOME",
              "RUFF_CHECK_OUTCOME",
              "RUFF_FORMAT_OUTCOME",
          )
          outcomes = {name: os.environ.get(name, "") for name in required}
          print(json.dumps(outcomes, sort_keys=True))
          sys.exit(0 if all(value == "success" for value in outcomes.values()) else 1)
          PYCODE

  type-check:
    name: Type Check
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run python -m mypy plugins/ scripts/ tests/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run bandit security scan
        run: uv run python -m bandit -r plugins/ scripts/ -x '*/tests/*' -ll -f json -o bandit-report.json

      - name: Report security findings
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          else
            echo "No bandit report generated"
          fi

  conformance:
    name: Saga Conformance
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify deterministic Saga scenarios
        run: uv run python scripts/saga_conformance.py verify --fixture reference-lifecycle

      - name: Validate approved Claude and Codex baseline
        run: uv run python scripts/saga_conformance.py validate-baseline docs/conformance/baselines/reference-lifecycle/manifest.yaml

  publish:
    name: Publish Plugin
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    needs: [tests, validate-lint, type-check, security, conformance]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: auto
          cache-dependency-glob: |
            **/uv.lock
            **/requirements*.txt
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Extract release information
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == plugins/* ]]; then
            PLUGIN=$(echo "$REF_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$REF_NAME" | cut -d'/' -f3)
            {
              echo "tag=$REF_NAME"
              echo "plugin=$PLUGIN"
              echo "version=$VERSION"
              echo "type=plugin"
            } >> "$GITHUB_OUTPUT"
            echo "Plugin release: $PLUGIN $VERSION"
          else
            VERSION="$REF_NAME"
            {
              echo "tag=$REF_NAME"
              echo "version=$VERSION"
              echo "type=marketplace"
            } >> "$GITHUB_OUTPUT"
            echo "Marketplace release: $VERSION"
          fi

      - name: Validate plugin before release
        if: steps.release.outputs.type == 'plugin'
        run: uv run python marketplace/validator/validate.py

      - name: Extract changelog
        id: changelog
        if: steps.release.outputs.type == 'plugin'
        env:
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -f "plugins/$PLUGIN_NAME/CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n "/## \[$RELEASE_VERSION\]/,/## \[/p" "plugins/$PLUGIN_NAME/CHANGELOG.md" | sed '$ d')
            {
              echo "changelog<<EOF"
              echo "$CHANGELOG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changelog=No changelog available" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.release.outputs.type == 'plugin' && format('{0} {1}', steps.release.outputs.plugin, steps.release.outputs.version) || format('Marketplace {0}', steps.release.outputs.version) }}
          body: |
            ${{ steps.release.outputs.type == 'plugin' && format('## {0} {1}', steps.release.outputs.plugin, steps.release.outputs.version) || format('## Infiquetra Plugin Marketplace {0}', steps.release.outputs.version) }}

            ${{ steps.changelog.outputs.changelog || 'See CHANGELOG.md for details.' }}

            ---

            ### Installation

            ```bash
            # Install from marketplace
            /plugin install ${{ steps.release.outputs.plugin }}
            ```

            ### Documentation
            - [Plugin README](https://github.com/infiquetra/infiquetra-antigravity-plugins/tree/main/plugins/${{ steps.release.outputs.plugin }})
            - [Marketplace Guide](https://github.com/infiquetra/infiquetra-antigravity-plugins/blob/main/docs/MARKETPLACE_GUIDE.md)
          draft: false
          prerelease: ${{ contains(steps.release.outputs.version, 'alpha') || contains(steps.release.outputs.version, 'beta') || contains(steps.release.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RELEASE_TYPE: ${{ steps.release.outputs.type }}
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            python - <<'PY' > slack-payload.json
          import json
          import os

          release_type = os.environ["RELEASE_TYPE"]
          plugin_name = os.environ.get("PLUGIN_NAME", "")
          release_version = os.environ["RELEASE_VERSION"]
          ref_name = os.environ["REF_NAME"]
          if release_type == "plugin":
              message = f"New plugin release: {plugin_name} {release_version}"
          else:
              message = f"New marketplace release: {release_version}"

          print(json.dumps({
              "channel": "",
              "text": message,
              "attachments": [{
                  "color": "good",
                  "fields": [{
                      "title": "Release",
                      "value": ref_name,
                      "short": True,
                  }, {
                      "title": "Repository",
                      "value": "antigravity-plugins",
                      "short": True,
                  }],
              }],
          }))
          PY
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              --data @slack-payload.json
          else
            echo "SLACK_WEBHOOK not configured, skipping notification"
          fi

      - name: Update marketplace index
        if: steps.release.outputs.type == 'plugin'
        env:
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Marketplace index update would happen here"
          echo "Plugin: $PLUGIN_NAME"
          echo "Version: $RELEASE_VERSION"
