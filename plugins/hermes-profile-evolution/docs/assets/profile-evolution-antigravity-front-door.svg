<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Antigravity profile evolution front door</title>
  <desc id="desc">The Antigravity command uses a separate plugin root and Team Mimir checkout, then routes a single governed target through the canonical Hermes producer. No blocking hook is claimed.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker><style>.title{font:700 38px system-ui;fill:#111827}.sub{font:400 21px system-ui;fill:#4b5563}.head{font:700 25px system-ui;fill:#111827}.body{font:400 20px system-ui;fill:#374151}.warn{font:700 18px system-ui;fill:#7c2d12}.box{stroke:#374151;stroke-width:3;rx:22}.line{stroke:#374151;stroke-width:5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="78" class="title">Antigravity profile evolution front door</text>
  <text x="80" y="116" class="sub">The plugin transports a request; producer systems retain policy and target authority.</text>
  <rect x="70" y="230" width="320" height="220" class="box" fill="#dbeafe"/><text x="100" y="280" class="head">Command or skill</text><text x="100" y="320" class="body">Explicit target root</text><text x="100" y="354" class="body">Claimed requester chain</text><text x="100" y="388" class="body">Bounded JSON input</text>
  <rect x="490" y="230" width="340" height="220" class="box" fill="#dcfce7"/><text x="520" y="280" class="head">Team Mimir checkout</text><text x="520" y="320" class="body">Runs real classifier</text><text x="520" y="354" class="body">Ordinary → return</text><text x="520" y="388" class="body">One target → continue</text>
  <rect x="930" y="230" width="300" height="220" class="box" fill="#ede9fe"/><text x="960" y="280" class="head">Hermes producer</text><text x="960" y="320" class="body">Doctor + dialogue</text><text x="960" y="354" class="body">Closed responses</text><text x="960" y="388" class="body">No offline queue</text>
  <rect x="1280" y="230" width="250" height="220" class="box" fill="#fef3c7"/><text x="1310" y="280" class="head">Target profile</text><text x="1310" y="320" class="body">Owns the answer</text><text x="1310" y="354" class="body">and any later</text><text x="1310" y="388" class="body">behavior change</text>
  <path d="M390 340 H480" class="line"/><path d="M830 340 H920" class="line"/><path d="M1230 340 H1270" class="line"/>
  <rect x="180" y="590" width="520" height="180" class="box" fill="#ffedd5"/><text x="215" y="640" class="head">Host boundary</text><text x="215" y="680" class="warn">No supported blocking hook</text><text x="215" y="718" class="body">Explicit command and skill only</text>
  <rect x="900" y="590" width="520" height="180" class="box" fill="#fee2e2"/><text x="935" y="640" class="head">Authority that never crosses</text><text x="935" y="680" class="body">No mutation · no commit · no credentials</text><text x="935" y="718" class="body">No provider choice · no target identity claim</text>
</svg>
